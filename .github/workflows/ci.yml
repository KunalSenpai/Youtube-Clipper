name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression checks
        run: python -m tests.test_isolation

      - name: Install caption test dependency
        run: python -m pip install pysubs2

      - name: Check publishing safety and caption timing
        run: python -m unittest tests.test_publishing_safety tests.test_storage_cleanup tests.test_captions

      - name: Validate dashboard JavaScript
        run: |
          node --check dashboard/app.js
          node --check dashboard/captions.js

      - name: Check crop editor transitions
        run: node tests/test_crop_editor.cjs
